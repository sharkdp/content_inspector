name: Python bindings

on:
  push:
    branches: [master]
    paths: ["python/**", "src/**", ".github/workflows/python.yml"]
  pull_request:
    paths: ["python/**", "src/**", ".github/workflows/python.yml"]

jobs:
  wheels:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          command: build
          args: --release --out dist
      - name: Install wheel and run tests
        shell: bash
        run: |
          pip install pytest
          pip install --no-index --find-links python/dist content_inspector
          pytest python/tests
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: python/dist
